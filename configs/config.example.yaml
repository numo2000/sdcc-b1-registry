# Configurazione di esempio per un nodo del service registry.
# Copiare in config.yaml e adattare per ogni nodo/ambiente (nessun valore
# hard-coded nel codice, vedi ARCHITETTURA.md sezione 10).

node:
  id: "node-1:7000"        # indirizzo host:port su cui gli altri nodi raggiungono questo nodo;
                            # usato anche come OwnerNodeID nel versioning delle entry (ARCHITETTURA.md, sez. 5)
  listen_port: 7000        # porta su cui il nodo si mette in ascolto (API client-facing + gossip)

bootstrap:
  seeds:                   # lista di nodi noti per il bootstrap iniziale
    - "node-2:7000"
    - "node-3:7000"

gossip:
  round_interval_ms: 1000   # intervallo tra un round di gossip e il successivo
  peers_per_round: 1        # numero di peer selezionati casualmente ad ogni round

failure_detection:
  timeout_suspect_ms: 3000  # tempo senza contatto prima di marcare un peer SUSPECTED
  timeout_dead_ms: 10000    # tempo senza contatto prima di marcare un peer DEAD
