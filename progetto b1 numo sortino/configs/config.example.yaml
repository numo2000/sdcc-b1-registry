# Configurazione di esempio per un nodo del service registry.
# Copiare in config.yaml e adattare per ogni nodo/ambiente (nessun valore
# hard-coded nel codice).

node:
  id: "node-1:8000"        # indirizzo host:grpc_port su cui gli altri nodi raggiungono questo nodo
                            # via gRPC per il gossip; usato anche come OwnerNodeID nel versioning
                            # delle entry — deve combaciare con grpc_port
  listen_port: 7000        # porta su cui il nodo espone le API client-facing (HTTP+JSON)
  grpc_port: 8000           # porta su cui il nodo espone il servizio gRPC di gossip (nodo<->nodo)

bootstrap:
  seeds:                   # lista di nodi noti per il bootstrap iniziale (indirizzi host:grpc_port)
    - "node-2:8000"
    - "node-3:8000"

gossip:
  round_interval_ms: 1000   # intervallo tra un round di gossip e il successivo
  peers_per_round: 2        # numero di peer least-recently-contacted selezionati ad ogni round
  dead_check_every_n_rounds: 10  # ogni tot round, contatta anche un peer DEAD (0 = disabilitato);
                                  # mitigazione per la guarigione di una partizione di rete sanata

failure_detection:
  timeout_suspect_ms: 3000  # tempo senza contatto prima di marcare un peer SUSPECTED
  timeout_dead_ms: 10000    # tempo senza contatto prima di marcare un peer DEAD

service_health:
  check_interval_ms: 5000   # intervallo tra un controllo di raggiungibilita' sui servizi registrati e il successivo (0 = disabilitato)
  check_timeout_ms: 500     # timeout di connessione TCP per un singolo controllo
